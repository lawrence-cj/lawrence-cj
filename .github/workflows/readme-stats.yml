name: Update README stats

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/readme-stats.yml"
      - ".github/scripts/patch-readme-stats.py"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate light stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=lawrence-cj&show_icons=true&include_all_commits=true&show=reviews%2Cdiscussions_answered&rank_icon=percentile"
          path: profile/stats-light.svg
          token: ${{ secrets.PROFILE_STATS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=lawrence-cj&theme=onedark&show_icons=true&include_all_commits=true&show=reviews%2Cdiscussions_answered&rank_icon=percentile"
          path: profile/stats-dark.svg
          token: ${{ secrets.PROFILE_STATS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Include core project stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/patch-readme-stats.py \
            --username lawrence-cj \
            --extra-repo PixArt-alpha/PixArt-alpha \
            --extra-repo PixArt-alpha/PixArt-Sigma \
            --extra-repo NVlabs/Sana \
            --extra-repo huggingface/diffusers \
            --svg profile/stats-light.svg \
            --svg profile/stats-dark.svg \
            --readme README.md

      - name: Generate light languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=lawrence-cj&layout=compact&exclude_repo=Hardware-Course&hide=Jupyter%20Notebook%2CMATLAB&langs_count=12"
          path: profile/languages-light.svg
          token: ${{ secrets.PROFILE_STATS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=lawrence-cj&theme=onedark&layout=compact&exclude_repo=Hardware-Course&hide=Jupyter%20Notebook%2CMATLAB&langs_count=12"
          path: profile/languages-dark.svg
          token: ${{ secrets.PROFILE_STATS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Validate cards
        run: |
          for card in profile/stats-light.svg profile/stats-dark.svg profile/languages-light.svg profile/languages-dark.svg; do
            test -s "$card"
            grep -q "<svg" "$card"
            if grep -Eqi "Something went wrong|Resource not accessible|User not found" "$card"; then
              echo "Invalid card: $card"
              exit 1
            fi
          done

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/*.svg
          git commit -m "Update README stats" || exit 0
          git push
