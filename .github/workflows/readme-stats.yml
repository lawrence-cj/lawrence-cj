name: Update README stats

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/readme-stats.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats cards
        run: |
          mkdir -p profile
          curl --fail --location --retry 3 --output profile/stats-light.svg "https://github-readme-stats-fast.vercel.app/api?username=lawrence-cj&show_icons=true&include_all_commits=true&show=reviews%2Cdiscussions_answered&rank_icon=percentile"
          curl --fail --location --retry 3 --output profile/stats-dark.svg "https://github-readme-stats-fast.vercel.app/api?username=lawrence-cj&theme=onedark&show_icons=true&include_all_commits=true&show=reviews%2Cdiscussions_answered&rank_icon=percentile"

      - name: Generate light languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=lawrence-cj&layout=compact&exclude_repo=Hardware-Course&hide=Jupyter%20Notebook%2CMATLAB&langs_count=12"
          path: profile/languages-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=lawrence-cj&theme=onedark&layout=compact&exclude_repo=Hardware-Course&hide=Jupyter%20Notebook%2CMATLAB&langs_count=12"
          path: profile/languages-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Validate cards
        run: |
          for card in profile/stats-light.svg profile/stats-dark.svg profile/languages-light.svg profile/languages-dark.svg; do
            test -s "$card"
            grep -q "<svg" "$card"
            if grep -Eqi "Something went wrong|Resource not accessible|User not found" "$card"; then
              echo "Invalid card: $card"
              exit 1
            fi
          done

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats" || exit 0
          git push
